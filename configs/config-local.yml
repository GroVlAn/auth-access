http:
  port: '9083'
  max_header_bytes: 1048576
  read_header_timeout: 10s
  write_timeout: 10s
  base_http_path: '/api/v1/access'

grpc:
  port: '9013'

settings:
  default_timeout: 15s

db:
  host: 'access_db'
  port: 5435
  ssl_mode: disable

middleware:
  allowed_origins:
    - 'https://*'
    - 'http://*'
  allowed_methods:
    - 'GET'
    - 'POST'
    - 'PATCH'
    - 'PUT'
    - 'DELETE'
    - 'OPTIONS'
  allowed_headers:
    - 'Accept'
    - 'Authorization'
    - 'Content-Type'
    - 'X-CSRF-Token'
  allow_credentials: true
  max_age: 300
